name: Fleezy Android Alpha

on:
  push:
    branches:
      - fleezy-alpha-0.1
    paths:
      - "android-native/**"
      - "VERSION"
      - ".github/workflows/fleezy-android.yml"
  workflow_dispatch:

concurrency:
  group: fleezy-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android-native
    steps:
      - uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Install stable Fleezy debug signing key
        run: |
          mkdir -p "$HOME/.android"
          base64 -d ci/fleezy-debug.keystore.b64 > "$HOME/.android/debug.keystore"

      - name: Read app version
        id: version
        working-directory: ${{ github.workspace }}
        run: echo "version=$(cat VERSION)" >> "$GITHUB_OUTPUT"

      - name: Compile Fleezy
        run: |
          chmod +x gradlew
          ./gradlew compileDebugKotlin --console=plain --stacktrace

      - name: Build debug APK
        run: ./gradlew assembleDebug --console=plain --stacktrace

      - name: Stage APK
        run: |
          mkdir -p ../artifacts
          cp app/build/outputs/apk/debug/app-debug.apk ../artifacts/FleezyPlayer-${{ steps.version.outputs.version }}-debug.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: FleezyPlayer-${{ steps.version.outputs.version }}-debug
          path: artifacts/FleezyPlayer-${{ steps.version.outputs.version }}-debug.apk
          if-no-files-found: error

      - name: Unit tests
        continue-on-error: true
        run: ./gradlew testDebugUnitTest --console=plain --stacktrace

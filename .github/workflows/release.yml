name: Fleezy Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    name: Build Fleezy APK + publish GitHub release
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android-native
    steps:
      - uses: actions/checkout@v4

      # Fail fast if the pushed tag and the single-source VERSION file disagree.
      # Tag "v1.0.29" must equal "v$(cat VERSION)".
      - name: Verify tag matches VERSION
        working-directory: ${{ github.workspace }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          EXPECTED="v$(cat VERSION)"
          echo "tag=$TAG expected=$EXPECTED"
          if [ "$TAG" != "$EXPECTED" ]; then
            echo "::error::Tag '$TAG' does not match VERSION file ('$EXPECTED'). Bump VERSION and retag."
            exit 1
          fi

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # ubuntu-latest ships a preinstalled Android SDK; the flaky
      # android-actions/setup-android action (emulator download) is avoided.

      - name: Setup Gradle (with cache)
        uses: gradle/actions/setup-gradle@v4

      # Production releases fail closed. Never publish stream.fleezy.player
      # with a debug/temporary signer: customers must always receive APKs signed
      # by the permanent Fleezy release identity.
      - name: Verify Fleezy signing secrets
        env:
          FLEEZY_KEYSTORE_BASE64: ${{ secrets.FLEEZY_KEYSTORE_BASE64 }}
          FLEEZY_KEYSTORE_PASSWORD: ${{ secrets.FLEEZY_KEYSTORE_PASSWORD }}
          FLEEZY_KEY_ALIAS: ${{ secrets.FLEEZY_KEY_ALIAS }}
          FLEEZY_KEY_PASSWORD: ${{ secrets.FLEEZY_KEY_PASSWORD }}
          FLEEZY_LINEAGE_BASE64: ${{ secrets.FLEEZY_LINEAGE_BASE64 }}
        run: |
          missing=0
          for v in FLEEZY_KEYSTORE_BASE64 FLEEZY_KEYSTORE_PASSWORD FLEEZY_KEY_ALIAS FLEEZY_KEY_PASSWORD FLEEZY_LINEAGE_BASE64; do
            if [ -z "${!v}" ]; then
              echo "::error::Missing required release secret: $v"
              missing=1
            fi
          done
          [ "$missing" -eq 0 ] || exit 1

      - name: Materialise Fleezy signing keystore
        id: signing
        env:
          FLEEZY_KEYSTORE_BASE64: ${{ secrets.FLEEZY_KEYSTORE_BASE64 }}
          FLEEZY_LINEAGE_BASE64: ${{ secrets.FLEEZY_LINEAGE_BASE64 }}
        run: |
          echo "$FLEEZY_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/fleezy.keystore"
          echo "$FLEEZY_LINEAGE_BASE64" | base64 -d > "$RUNNER_TEMP/fleezy.lineage"
          echo "keystore=$RUNNER_TEMP/fleezy.keystore" >> "$GITHUB_OUTPUT"
          echo "lineage=$RUNNER_TEMP/fleezy.lineage" >> "$GITHUB_OUTPUT"
          echo "Release signing material configured."

      - name: Build release APK
        env:
          FLEEZY_KEYSTORE: ${{ steps.signing.outputs.keystore }}
          FLEEZY_KEYSTORE_PASSWORD: ${{ secrets.FLEEZY_KEYSTORE_PASSWORD }}
          FLEEZY_KEY_ALIAS: ${{ secrets.FLEEZY_KEY_ALIAS }}
          FLEEZY_KEY_PASSWORD: ${{ secrets.FLEEZY_KEY_PASSWORD }}
          FLEEZY_LINEAGE: ${{ steps.signing.outputs.lineage }}
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease resignRelease --console=plain --stacktrace

      # AGP emits app-release.apk; the Fleezy release artifact uses a stable customer-facing filename.
      # Emit a sibling SHA-256 file for verification and future Fleezy updater support.
      - name: Stage release assets
        working-directory: ${{ github.workspace }}
        run: |
          mkdir -p dist
          SRC="android-native/app/build/outputs/apk/release/app-release.apk"
          if [ ! -f "$SRC" ]; then
            echo "::error::Expected APK not found at $SRC"
            ls -R android-native/app/build/outputs/apk || true
            exit 1
          fi
          cp "$SRC" dist/FleezyPlayer.apk
          cd dist
          sha256sum FleezyPlayer.apk | awk '{print $1}' > FleezyPlayer.apk.sha256
          echo "SHA-256:"; cat FleezyPlayer.apk.sha256

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            dist/FleezyPlayer.apk
            dist/FleezyPlayer.apk.sha256
